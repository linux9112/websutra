<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="dmBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#222228" />
      <stop offset="55%" stop-color="#111115" />
      <stop offset="100%" stop-color="#070709" />
    </radialGradient>

    <!-- Chrome Silver Gradient 1 (Dindayal - D) -->
    <linearGradient id="chromeD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e0e0e0" />
      <stop offset="70%" stop-color="#8a8a93" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Chrome Silver Gradient 2 (Manmohan - M) -->
    <linearGradient id="chromeM" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f7" />
      <stop offset="40%" stop-color="#b0b0b8" />
      <stop offset="80%" stop-color="#555560" />
      <stop offset="100%" stop-color="#e5e5eb" />
    </linearGradient>

    <!-- Emerald / Cyber Cyan Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#25d366" />
      <stop offset="50%" stop-color="#64b5f6" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Metallic Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#44444c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#9999a6" stop-opacity="0.75" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="dmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Obsidian Rounded Squircle Badge -->
  <rect x="18" y="18" width="476" height="476" rx="125" fill="url(#dmBg)" stroke="url(#rimGrad)" stroke-width="7" />
  
  <!-- Subtle Inner Contour Line -->
  <rect x="30" y="30" width="452" height="452" rx="113" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2.5" />

  <!-- D & M Interlocking Modern Monogram -->
  <g filter="url(#dmGlow)" transform="translate(4, 0)">
    
    <!-- LEFT PILLAR & CURVE OF 'D' (Dindayal) -->
    <!-- D Left Vertical Stem -->
    <path d="M 120 140 L 165 140 L 165 372 L 120 372 Z" fill="url(#chromeD)" />
    
    <!-- D Outer Curve which seamlessly enters into M -->
    <path d="M 165 140 C 265 140, 290 210, 245 270 C 225 295, 195 305, 165 305 L 165 260 C 185 260, 205 250, 212 235 C 225 210, 210 185, 165 185 Z" fill="url(#chromeD)" />
    
    <!-- D Bottom Base Extension -->
    <path d="M 120 327 L 220 327 C 255 327, 280 345, 275 372 L 120 372 Z" fill="url(#chromeD)" opacity="0.9" />

    <!-- 'M' EMBEDDED & INTERWOVEN (Manmohan) -->
    <!-- M Center Peak to Left Descent -->
    <path d="M 235 372 L 290 190 L 325 190 L 270 372 Z" fill="url(#chromeM)" />
    
    <!-- M Center Valley to Right Rise -->
    <path d="M 290 190 L 345 325 L 375 325 L 325 190 Z" fill="url(#accentGrad)" />

    <!-- M Right Outer Vertical / Diagonal Pillar -->
    <path d="M 345 325 L 395 140 L 435 140 L 385 372 L 345 372 Z" fill="url(#chromeM)" />

    <!-- Cyber Connection Node / Core Pivot between D and M -->
    <circle cx="256" cy="256" r="8" fill="#ffffff" filter="url(#dmGlow)" />
  </g>

  <!-- Typography Subtitle -->
  <text x="256" y="440" 
        text-anchor="middle" 
        font-family="'Inter', sans-serif" 
        font-size="20" 
        font-weight="700" 
        letter-spacing="9" 
        fill="#a1a1aa">
    DINDAYAL · MANMOHAN
  </text>
</svg>
