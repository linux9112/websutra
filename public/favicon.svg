<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#242428" />
      <stop offset="60%" stop-color="#121214" />
      <stop offset="100%" stop-color="#08080a" />
    </radialGradient>

    <!-- Chrome Metallic Gradient 1 -->
    <linearGradient id="chrome1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#d4d4d8" />
      <stop offset="70%" stop-color="#8e8e93" />
      <stop offset="100%" stop-color="#e4e4e7" />
    </linearGradient>

    <!-- Chrome Metallic Gradient 2 -->
    <linearGradient id="chrome2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5" />
      <stop offset="40%" stop-color="#a1a1aa" />
      <stop offset="75%" stop-color="#52525b" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#52525b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a1a1aa" stop-opacity="0.7" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Inner Ambient Glow Ring -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="3" />

  <!-- Geometric Modern 'W' & 'S' Weave Monogram -->
  <g filter="url(#glow)">
    <!-- Left Wing of W -->
    <path d="M120 160 L180 340 L220 340 L160 160 Z" fill="url(#chrome1)" />
    
    <!-- Center-Left Peak to Valley -->
    <path d="M180 340 L256 195 L285 245 L225 340 Z" fill="url(#chrome2)" />

    <!-- Center-Right Valley to Peak -->
    <path d="M256 195 L332 340 L292 340 L228 220 Z" fill="url(#chrome1)" opacity="0.9" />

    <!-- Right Wing of W -->
    <path d="M292 340 L352 160 L392 160 L332 340 Z" fill="url(#chrome2)" />

    <!-- Stylized 'S' Digital Thread / Sutra Loop -->
    <path d="M165 240 C165 200, 320 180, 350 220 C380 260, 200 275, 200 320 C200 365, 345 350, 355 310" 
          fill="none" 
          stroke="url(#chrome1)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Central Tech Node / Core Spark -->
    <circle cx="256" cy="256" r="10" fill="#ffffff" filter="url(#glow)" />
  </g>
</svg>
